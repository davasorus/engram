version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: / # must be the dir containing your Dockerfile/Containerfile
    schedule:
      interval: daily
    commit-message:
      prefix: "chore"
      include: "scope"
