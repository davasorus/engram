# Dependabot coverage for engram's full dependency surface:
#   - Go modules (go.mod)
#   - GitHub Actions (workflow `uses:`)
#   - Dockerfile base images (digest + tag updates — FROMs are digest-pinned)
#   - compose/compose.yml service images (pgvector)
#
# NOT covered by dependabot (no ecosystem for raw k8s manifests):
#   - kube/engram.yaml — its pgvector image must be kept in sync with
#     compose/compose.yml by hand when a compose PR lands.
#   - `with: version:` pins inside workflow steps (e.g. the golangci-lint
#     binary version) — dependabot bumps the *action* ref only.
#   - the `go` directive in go.mod (toolchain) — tracked via the golang
#     builder image bump in the Dockerfile instead.
#
# Security updates ignore these schedules and open PRs immediately
# (requires Dependabot alerts + security updates enabled in repo settings).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Detroit
    # Let brand-new releases soak before PRing them (supply-chain hygiene).
    cooldown:
      default-days: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Batch the routine stuff; majors arrive as individual PRs so a
      # pgx v6-style breaking bump never hides inside a batch.
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["deps", "go"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Detroit
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["deps", "ci"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Detroit
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["deps", "docker"]

  # Service images in the compose stack (pgvector/pgvector:pg16).
  - package-ecosystem: docker-compose
    directory: /compose
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Detroit
    commit-message:
      prefix: "chore"
      include: "scope"
    labels: ["deps", "docker"]
