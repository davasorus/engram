name: ci

on:
  push:
    branches: [live]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          skip-cache: true

      - name: vendored asset drift check
        run: sh scripts/check-asset-drift.sh

      - name: lint .env.example
        run: |
          while IFS= read -r line; do
            case "$line" in
              ""|\#*) continue ;;
              *=*) ;;
              *) echo "invalid line: $line" >&2; exit 1 ;;
            esac
          done < compose/.env.example

      - name: cache kubeconform
        id: cache-kubeconform
        uses: actions/cache@v6
        with:
          path: ~/go/bin/kubeconform
          key: kubeconform-v0.6.4-${{ runner.os }}

      - name: install kubeconform
        if: steps.cache-kubeconform.outputs.cache-hit != 'true'
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.4

      - name: validate k8s manifest
        run: ~/go/bin/kubeconform -strict kube/

      - name: validate compose manifest
        run: docker compose -f compose/compose.yml config --quiet

  tests:
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: "85"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: test + coverage
        shell: bash
        run: |
          set +e
          go test -race -covermode=atomic -tags=integration -coverprofile=cover.out ./... 2>&1 | tee test.log
          TEST_STATUS=${PIPESTATUS[0]}
          set -e

          {
            echo "## Test & coverage report"
            echo

            if [ "$TEST_STATUS" -ne 0 ]; then
              echo "### ❌ Tests failed"
              echo '```'
              grep -E '^(--- FAIL|FAIL|panic:)' test.log | sort -u
              echo '```'
              echo
            fi

            echo "| Package | Coverage | Status |"
            echo "|---|---:|:---:|"
            awk -v th="$COVERAGE_THRESHOLD" '
              /^ok .*coverage:/ {
                pkg=$2
                for (i=1; i<=NF; i++) if ($i=="coverage:") pct=$(i+1)
                sub(/%/, "", pct)
                sub(/^github.com\/[^\/]+\/[^\/]+\//, "", pkg)
                printf "| %s | %.1f%% | %s |\n", pkg, pct, (pct+0 >= th ? "✅" : "⚠️")
              }
              /^FAIL[ \t]/ && $2 != "" {
                pkg=$2
                sub(/^github.com\/[^\/]+\/[^\/]+\//, "", pkg)
                printf "| %s | – | ❌ |\n", pkg
              }
            ' test.log
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TEST_STATUS" -ne 0 ]; then
            echo "::error::Tests failed (see job summary)"
            exit "$TEST_STATUS"
          fi

          TOTAL=$(go tool cover -func=cover.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "TOTAL_COVERAGE=$TOTAL" >> "$GITHUB_ENV"

          if awk -v t="$TOTAL" -v th="$COVERAGE_THRESHOLD" 'BEGIN{exit !(t+0 < th+0)}'; then
            {
              echo "**Total: ${TOTAL}% — ❌ below gate of ${COVERAGE_THRESHOLD}%**"
              echo
              echo "<details><summary>Lowest-covered functions</summary>"
              echo
              echo '```'
              go tool cover -func=cover.out | awk '$1 != "total:" {print $3, $1, $2}' | sort -n | head -15
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Coverage ${TOTAL}% is below the ${COVERAGE_THRESHOLD}% gate"
            exit 1
          fi

          echo "**Total: ${TOTAL}% — ✅ meets gate of ${COVERAGE_THRESHOLD}%**" >> "$GITHUB_STEP_SUMMARY"

      - name: upload coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            cover.out
            test.log
          if-no-files-found: ignore

      - name: upload coverage to Coveralls
        if: ${{ !cancelled() && hashFiles('cover.out') != '' && github.event.pull_request.head.repo.fork != true }}
        uses: coverallsapp/github-action@v2
        with:
          file: cover.out
          format: golang
          fail-on-error: false
          github-token: ${{ secrets.COVERALLS_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: engram-ci-test:latest

      - name: verify HEALTHCHECK
        run: |
          docker inspect --format='{{json .Config.Healthcheck}}' engram-ci-test:latest | python3 -m json.tool
