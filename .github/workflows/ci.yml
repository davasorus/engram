name: ci

on:
  push:
    branches: [live]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      # govet, gofmt, goimports all run via golangci-lint —
      # no standalone steps, one source of truth (.golangci.yml).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          # setup-go above already caches modules/build artifacts;
          # avoid the action double-caching the same dirs.
          skip-cache: true

      # Vendored JS (htmx/alpine in internal/web/static) must match the
      # versions in package.json — the manifest dependabot tracks. Node is
      # preinstalled on ubuntu runners.
      - name: vendored asset drift check
        run: sh scripts/check-asset-drift.sh

      - name: install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@latest

      - name: validate k8s manifest
        run: kubeconform -strict kube/

      - name: validate compose manifest
        run: |
          pip install pyyaml -q
          python -c "import yaml; yaml.safe_load(open('compose/compose.yml'))"

      - name: lint .env.example
        run: |
          while IFS= read -r line; do
            case "$line" in
              ""|\#*) continue ;;
              *=*) ;;
              *) echo "invalid line: $line" >&2; exit 1 ;;
            esac
          done < compose/.env.example

      - name: unit tests
        run: go test -race -cover ./...

      # Integration tests spin up a real pgvector container via testcontainers.
      # Docker daemon is available on GitHub's ubuntu runners by default.
      - name: integration tests (pgvector)
        run: go test -tags=integration -race ./internal/store/...
