name: ci

on:
  push:
    branches: [live]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: unit tests
        run: go test -race -cover ./...

      # Integration tests spin up a real pgvector container via testcontainers.
      # The Docker daemon is available on GitHub's ubuntu runners by default.
      - name: integration tests (pgvector)
        run: go test -tags=integration -race ./internal/store/...
