name: prepare-release

# Run manually (Actions tab -> prepare-release -> Run workflow) with the
# version to release (no leading v, e.g. 0.2.0). This bumps
# compose/.env.example, commits that bump, then creates and pushes the tag
# ON that commit — so the tag itself (what GoReleaser builds from, and what
# anyone checking out v0.2.0 sees) is self-consistent from the start. The
# tag push triggers the existing `release` workflow.
#
# Requires a repo secret RELEASE_PAT (contents: read/write on this repo)
# so the push authenticates as a real account rather than github-actions[bot]
# — needed if the `live` branch is protected and only bypasses admins/
# specific users, not the default GITHUB_TOKEN identity.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, no leading v (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: live
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: validate version
        run: |
          set -euo pipefail
          v="${{ inputs.version }}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not semver: $v" >&2; exit 1; }
          tag="v${v}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag $tag already exists" >&2
            exit 1
          fi

      - name: bump ENGRAM_VERSION and tag
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          tag="v${version}"
          sed -i -E "s/^ENGRAM_VERSION=.*/ENGRAM_VERSION=${version}/" compose/.env.example
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- compose/.env.example; then
            echo "ENGRAM_VERSION already ${version}; tagging current HEAD as-is"
          else
            git add compose/.env.example
            git commit -m "chore: release ${tag}"
          fi
          git tag -a "$tag" -m "Release ${tag}"
          git push origin live
          git push origin "$tag"
