name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write # create GitHub Releases
  packages: write # push images to GHCR
concurrency:
  group: release-${{ github.ref }}
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs full history/tags
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      # govet, gofmt, goimports all run via golangci-lint —
      # no standalone steps, one source of truth (.golangci.yml).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          # setup-go above already caches modules/build artifacts;
          # avoid the action double-caching the same dirs.
          skip-cache: true
      - name: unit tests
        run: go test -race -cover ./...
      # Integration tests spin up a real pgvector container via testcontainers.
      # Docker daemon is available on GitHub's ubuntu runners by default.
      - name: integration tests (pgvector)
        run: go test -tags=integration -race ./internal/store/...
      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2" # latest GoReleaser v2.x, won't jump majors
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Migration image: Liquibase + the changelog (db/Dockerfile). Published
      # alongside engram and tagged identically, so compose/kube can pull
      # ghcr.io/davasorus/engram-migrate:<version>. The changelog lives only
      # in db/changelog — this image is its single deploy-time home.
      - name: Build & push migrate image
        # Derive the version without the leading 'v' so the migrate image tag
        # matches engram's GoReleaser tags (engram:0.4.0, not v0.4.0).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building engram-migrate:${VERSION}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file db/Dockerfile \
            --tag "ghcr.io/davasorus/engram-migrate:${VERSION}" \
            --tag "ghcr.io/davasorus/engram-migrate:latest" \
            --push \
            .
