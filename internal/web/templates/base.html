{{define "base"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{template "title" .}}</title>
<link rel="stylesheet" href="/static/style.css">
<!-- vendored: htmx 2.0.10, Alpine 3.16.2 -->
<script src="/static/htmx.min.js"></script>
<script defer src="/static/alpine.min.js"></script>

<!-- CDN, pinned + SRI -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css"
      integrity="sha384-nH0MfJ44wi1dd7w6jinlyBgljjS8EJAh2JBoRad8a3VDw2K69vfaaqm4WnR+gXtA"
      crossorigin="anonymous">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">engram</a>

  <!-- Quick search: works from ANY page. Results drop down below the box.
       Enter jumps to the full /search page. Escape clears. -->
  <div class="quicksearch" x-data="quicksearch()" @keydown.escape="clear()" @click.outside="close()">
    <div class="qs-inputrow">
      <input type="search" name="q" placeholder="search memory…  (Enter for full results)"
             autocomplete="off"
             x-ref="q"
             hx-get="/frag/search"
             hx-trigger="keyup changed delay:250ms"
             hx-target="#qs-dropdown" hx-swap="innerHTML"
             hx-vals='js:{mode:"dropdown", kind: document.querySelector("[name=qs-kind]").value}'
             hx-indicator="#qs-spin"
             @focus="open=true" @keydown.enter="goFull()"
             value="{{if .Query}}{{.Query}}{{end}}">
      <select name="qs-kind" class="qs-kind"
              @change="rerun()"
              title="semantic = by meaning · keyword = exact words">
        <option value="semantic">semantic</option>
        <option value="keyword">keyword</option>
      </select>
      <span id="qs-spin" class="qs-spin htmx-indicator">searching…</span>
    </div>
    <div id="qs-dropdown" class="qs-dropdown" x-show="open" x-cloak></div>
  </div>

  <a class="newbtn" href="/new">+ new</a>
</header>
<main>
{{template "content" .}}
</main>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.8/dist/mermaid.min.js"
        integrity="sha384-N3QqR/7q+xm3BGX+CBbNI8AUmRRqcsDzToy+0z1NLDI0QmTKW8zvwLvqulJgk3dP"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.js"
        integrity="sha384-CwjPRVHTvLiMBFjEoij+QZViMV5rhTOIp7CJzl24JEqpRDA1sJFHVXXLURktbYYp"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.js"
        integrity="sha384-CwjPRVHTvLiMBFjEoij+QZViMV5rhTOIp7CJzl24JEqpRDA1sJFHVXXLURktbYYp"
        crossorigin="anonymous"></script>
<script src="/static/app.js"></script>
</body>
</html>{{end}}
