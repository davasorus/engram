# GoReleaser — builds binaries, a multi-arch container image, and a GitHub
# Release when a semver tag (vX.Y.Z) is pushed.
#   Local dry run:  goreleaser release --snapshot --clean
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: engram
    main: ./cmd/engram
    binary: engram
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Release notes are generated from git commits since the previous tag, grouped
# into sections and with noise filtered out. Grouping keys off conventional
# commit prefixes (feat:, fix:, etc.); commits without a recognized prefix fall
# into "Other". Writing commit subjects as "feat: ...", "fix: ...", "docs: ..."
# produces the cleanest notes, but this degrades gracefully without them.
changelog:
  use: git
  sort: asc
  filters:
    # Drop low-signal commits from the notes entirely.
    exclude:
      - "^wip"
      - "^WIP"
      - "^Merge branch"
      - "^Merge pull request"
      - "^chore\\(release\\)"
      - "typo"
      - "^\\s*$"
  groups:
    - title: "Features"
      regexp: '(?i)^feat(\(.+\))?:'
      order: 0
    - title: "Bug fixes"
      regexp: '(?i)^fix(\(.+\))?:'
      order: 1
    - title: "Schema / migrations"
      regexp: '(?i)^(migrat|schema|db)(\(.+\))?:'
      order: 2
    - title: "Documentation"
      regexp: '(?i)^docs(\(.+\))?:'
      order: 3
    - title: "Build / CI / deps"
      regexp: '(?i)^(build|ci|deps|chore)(\(.+\))?:'
      order: 4
    - title: "Other changes"
      order: 999

dockers:
  - image_templates:
      - "ghcr.io/davasorus/engram:{{ .Version }}-amd64"
    use: buildx
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/davasorus/engram"
      - "--label=org.opencontainers.image.version={{ .Version }}"
    goarch: amd64
  - image_templates:
      - "ghcr.io/davasorus/engram:{{ .Version }}-arm64"
    use: buildx
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/davasorus/engram"
      - "--label=org.opencontainers.image.version={{ .Version }}"
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/davasorus/engram:{{ .Version }}"
    image_templates:
      - "ghcr.io/davasorus/engram:{{ .Version }}-amd64"
      - "ghcr.io/davasorus/engram:{{ .Version }}-arm64"
  - name_template: "ghcr.io/davasorus/engram:latest"
    image_templates:
      - "ghcr.io/davasorus/engram:{{ .Version }}-amd64"
      - "ghcr.io/davasorus/engram:{{ .Version }}-arm64"

release:
  github:
    owner: davasorus
    name: engram
  # A short intro prepended above the generated changelog, and a footer with
  # the full-diff link and the images published for this release.
  header: |
    ## engram {{ .Tag }}

    Self-hosted, markdown-native memory service for AI agents.

    **Container images** (multi-arch, published to GHCR):
    - `ghcr.io/davasorus/engram:{{ .Version }}`
    - `ghcr.io/davasorus/engram-migrate:{{ .Version }}`

    Deploy or upgrade with the attached `compose.yml` + `env.example`
    (see [UPGRADING.md](https://github.com/davasorus/engram/blob/{{ .Tag }}/docs/UPGRADING.md)).
  footer: |
    ---
    {{ if .PreviousTag }}**Full changelog**: https://github.com/davasorus/engram/compare/{{ .PreviousTag }}...{{ .Tag }}{{ else }}**Full changelog**: https://github.com/davasorus/engram/commits/{{ .Tag }}{{ end }}
  # Deploy artifacts for image-only consumers: someone who pulled from GHCR
  # has no repo checkout, so the compose file, env template, and kube
  # manifest ship on the release itself (see deployHint in cmd/engram).
  extra_files:
    - glob: compose/compose.yml
      name_template: compose.yml
    - glob: compose/.env.example
      name_template: env.example
    - glob: kube/engram.yaml
      name_template: engram-kube.yaml
    - glob: kube/secret.example.yaml
      name_template: secret.example.yaml
