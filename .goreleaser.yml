# GoReleaser — builds binaries, a multi-arch container image, and a GitHub
# Release when a semver tag (vX.Y.Z) is pushed.
#   Local dry run:  goreleaser release --snapshot --clean
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: engram
    main: ./cmd/engram
    binary: engram
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

dockers:
  - image_templates:
      - "ghcr.io/davasorus/engram:{{ .Version }}-amd64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/davasorus/engram"
      - "--label=org.opencontainers.image.version={{ .Version }}"
    goarch: amd64
  - image_templates:
      - "ghcr.io/davasorus/engram:{{ .Version }}-arm64"
    use: buildx
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/davasorus/engram"
      - "--label=org.opencontainers.image.version={{ .Version }}"
    goarch: arm64

docker_manifests:
  - name_template: "ghcr.io/davasorus/engram:{{ .Version }}"
    image_templates:
      - "ghcr.io/davasorus/engram:{{ .Version }}-amd64"
      - "ghcr.io/davasorus/engram:{{ .Version }}-arm64"
  - name_template: "ghcr.io/davasorus/engram:latest"
    image_templates:
      - "ghcr.io/davasorus/engram:{{ .Version }}-amd64"
      - "ghcr.io/davasorus/engram:{{ .Version }}-arm64"

release:
  github:
    owner: davasorus
    name: engram
