# DB password secret for engram — created LOCALLY, never committed.
#
#   sed "s/REPLACE_ME/$(openssl rand -hex 20)/" secret.example.yaml | podman kube play -
#
# kubectl equivalent:
#   kubectl create secret generic engram-db --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 20)"
apiVersion: v1
kind: Secret
metadata:
  name: engram-db
  labels: { app: engram }
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_ME
